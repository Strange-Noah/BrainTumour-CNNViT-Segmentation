name: Real dataset audit
on:
  workflow_dispatch:
    inputs:
      start:
        type: number
        default: 0
      count:
        type: number
        default: 10
permissions:
  contents: read
concurrency: dataset-audit-${{ inputs.start }}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: tcia-ingestion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r cloud/requirements.txt
      - name: Audit completed patients with resumable private records
        env:
          START: ${{ inputs.start }}
          COUNT: ${{ inputs.count }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: novo-nordisk-pbl
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          start, count = int(os.environ["START"]), int(os.environ["COUNT"])
          if start < 0 or not 1 <= count <= 10 or start + count > 300:
              raise ValueError("Use a bounded range of up to 10 patients")
          for index in range(start, start + count):
              subprocess.run([sys.executable, "cloud/audit_dataset.py", "--start", str(index), "--count", "1",
                              "--output", os.path.join(os.environ["RUNNER_TEMP"], "audit", str(index))], check=True)
          PY
