name: Private Kaggle benchmark bridge
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, validate, benchmark, collect, formal, recover]
        required: true
      gpu_session_seconds:
        type: number
        default: 2100
      formal_training_authorized:
        type: boolean
        default: false
        description: Owner-approved formal training only
      approved_gpu_budget_seconds:
        type: number
        default: 0
        description: Explicit cumulative owner budget; zero forbids GPU submission
      dataset:
        type: string
        default: mathewzhou/novo-unet25d-benchmark-cache
      kernel:
        type: string
        default: mathewzhou/novo-unet25d-bounded-benchmark
concurrency:
  group: novo-private-kaggle-bridge
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  orchestrate:
    environment: tcia-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q kaggle==2.2.4 -r cloud/requirements.txt
      - name: CPU preparation dependencies only
        if: inputs.mode == 'prepare'
        run: |
          python -m pip install -q torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r experiments/unet25d/requirements.txt
      - name: Orchestrate private inputs and artifacts
        env:
          GPU_SESSION_SECONDS: ${{ inputs.gpu_session_seconds || 43200 }}
          MODE: ${{ github.event_name == 'schedule' && 'recover' || inputs.mode }}
          DATASET: ${{ github.event_name == 'schedule' && 'mathewzhou/novo-unet25d-full-cohort-input' || inputs.dataset }}
          KERNEL: ${{ github.event_name == 'schedule' && 'mathewzhou/novo-unet25d-full-cohort-training' || inputs.kernel }}
          FORMAL_TRAINING_AUTHORIZED: ${{ inputs.formal_training_authorized || false }}
          APPROVED_GPU_BUDGET_SECONDS: ${{ inputs.approved_gpu_budget_seconds || 0 }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          NOVO_SOURCE_SHA: ${{ github.sha }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: novo-nordisk-pbl
          R2_OUTPUT_BUCKET: novo-nordisk-pbl-outputs
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_OUTPUT_ACCESS_KEY_ID: ${{ secrets.R2_OUTPUT_ACCESS_KEY_ID }}
          R2_OUTPUT_SECRET_ACCESS_KEY: ${{ secrets.R2_OUTPUT_SECRET_ACCESS_KEY }}
        run: python -m cloud.kaggle_benchmark_bridge
