name: CNN ViT real UCSD pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: tcia-verification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU model runtime
        run: |
          python -m pip install -q torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r experiments/cnn_vit_requirements.txt
      - name: Actual checkpoint forward and small UCSD fine-tune
        run: python -m experiments.cnn_vit_real_run --work "$RUNNER_TEMP/cnn-vit" --steps 4 --inference
        env:
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: novo-nordisk-pbl
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_OUTPUT_BUCKET: novo-nordisk-pbl-outputs
          R2_OUTPUT_ACCESS_KEY_ID: ${{ secrets.R2_OUTPUT_ACCESS_KEY_ID }}
          R2_OUTPUT_SECRET_ACCESS_KEY: ${{ secrets.R2_OUTPUT_SECRET_ACCESS_KEY }}
          HF_HUB_DOWNLOAD_TIMEOUT: '60'
