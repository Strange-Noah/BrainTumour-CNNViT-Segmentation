name: Deploy MRI viewer
on:
  push:
    branches: [main]
    paths:
      - deployment/longitudinal_viewer/**
      - .github/workflows/space.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.HF_SPACE_ID != '' && vars.HF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: hugging-face
    concurrency:
      group: longitudinal-hf-space
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==1.28.0
      - name: Publish reviewed viewer source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          test -n "$HF_TOKEN"
          case "${HF_SPACE_ID,,}" in
            tlommp/*|brain-tumour-team/*) exit 1 ;;
          esac
          hf upload "$HF_SPACE_ID" deployment/longitudinal_viewer . --repo-type space --commit-message "GitHub $GITHUB_SHA"
