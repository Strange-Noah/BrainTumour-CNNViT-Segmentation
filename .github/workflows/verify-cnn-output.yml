name: Recover CNN experiment outputs
on:
  workflow_dispatch:
    inputs:
      experiment_run:
        type: string
        required: true
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: tcia-verification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r cloud/requirements.txt
      - run: python -m research.verify_cnn_output "$EXPERIMENT_RUN"
        env:
          EXPERIMENT_RUN: ${{ inputs.experiment_run }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_OUTPUT_BUCKET: novo-nordisk-pbl-outputs
          R2_OUTPUT_ACCESS_KEY_ID: ${{ secrets.R2_OUTPUT_ACCESS_KEY_ID }}
          R2_OUTPUT_SECRET_ACCESS_KEY: ${{ secrets.R2_OUTPUT_SECRET_ACCESS_KEY }}
