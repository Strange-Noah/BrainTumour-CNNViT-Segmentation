name: Longitudinal code checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install cloud and viewer dependencies
        run: |
          python -m pip install -r cloud/requirements.txt
          python -m pip install gradio==6.1.0 -r deployment/longitudinal_viewer/requirements.txt
          python -m pip check
      - name: Check cloud entry points and synthetic viewer
        run: |
          python -m compileall -q cloud deployment/longitudinal_viewer
          for script in cloud/{smoke,read_smoke,manifest,audit_visit,ingest,tcia_pilot,kaggle_smoke}.py; do
            python "$script" --help > /dev/null
          done
          cd deployment/longitudinal_viewer
          python - <<'PY'
          from app import review
          x, y, z, summary = review(None, None, 50, 50, 50)
          assert all(panel.size for panel in (x, y, z))
          assert "0.502 mL" in summary
          PY
